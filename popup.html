<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Feed Cleaner for LinkedIn</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    /* Popup-specific layout; shared rows/switches/buttons live in ui.css. */
    body {
      width: 320px;
      margin: 0;
      font-size: 13px;
      background: #fff;
    }
    header {
      padding: 12px 16px;
      background: var(--lfc-blue);
      color: #fff;
    }
    header h1 { margin: 0; font-size: 15px; }
    header .count { font-size: 12px; opacity: 0.85; margin-top: 2px; }
    main { padding: 8px 16px 12px; }
    .row.master { font-weight: 600; }

    .sub { padding: 6px 0 10px; border-bottom: 1px solid var(--lfc-row-border); }
    .hint { font-size: 11px; margin: 2px 0 4px; }
    .sensitivity input[type="range"] { flex: 1; }
    .sensitivity .level-label { text-align: right; }

    #snoozeBtn {
      border: 1px solid var(--lfc-blue); background: #fff; color: var(--lfc-blue);
      border-radius: 14px; padding: 3px 12px; font-size: 12px;
      font-weight: 600; cursor: pointer;
    }
    #snoozeBtn.active { background: var(--lfc-blue); color: #fff; }
    #snoozeState { font-size: 11px; color: #b7791f; }

    /* Deep Focus chips. The row stays OUTSIDE .pausable on purpose:
       pausing the filters must not grey out (or reveal) Deep Focus. */
    .chips { display: flex; gap: 4px; }
    .chip {
      border: 1px solid var(--lfc-blue); background: #fff; color: var(--lfc-blue);
      border-radius: 12px; padding: 2px 9px; font-size: 11px;
      font-weight: 600; cursor: pointer;
    }
    .chip.active { background: var(--lfc-blue); color: #fff; }
    #deepFocusState { font-size: 11px; color: #b7791f; display: block; }

    /* Everything below the master switch greys out while paused */
    main.paused .pausable { opacity: 0.45; pointer-events: none; }

    footer {
      padding: 8px 16px 12px; border-top: 1px solid #eee;
      display: flex; justify-content: space-between; align-items: center;
    }
    footer a { color: #0a66c2; font-size: 12px; font-weight: 600; text-decoration: none; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1>Feed Cleaner for LinkedIn</h1>
    <div class="count"><span id="hiddenCount">0</span> posts hidden in this tab</div>
  </header>
  <main id="main">
    <div class="row master">
      <label for="enabled">Filtering enabled</label>
      <label class="switch">
        <input type="checkbox" id="enabled">
        <span class="slider-toggle"></span>
      </label>
    </div>
    <div class="row pausable">
      <span id="snoozeState">Pause temporarily</span>
      <button id="snoozeBtn">Snooze 30 min</button>
    </div>
    <div class="row">
      <label>Deep Focus - hide the whole feed
        <span id="deepFocusState"></span></label>
      <span class="chips">
        <button class="chip" id="dfOn">On</button>
        <button class="chip" id="dfHour">1 hour</button>
        <button class="chip" id="dfOff">Off</button>
      </span>
    </div>

    <div class="pausable">
      <div class="row">
        <label for="filterPromoted">Hide sponsored / promoted posts</label>
        <label class="switch">
          <input type="checkbox" id="filterPromoted">
          <span class="slider-toggle"></span>
        </label>
      </div>

      <div class="row">
        <label for="filterKeywords">Hide muted phrases</label>
        <label class="switch">
          <input type="checkbox" id="filterKeywords">
          <span class="slider-toggle"></span>
        </label>
      </div>

      <div class="row">
        <label for="filterOccasions">Hide new-job / anniversary posts</label>
        <label class="switch">
          <input type="checkbox" id="filterOccasions">
          <span class="slider-toggle"></span>
        </label>
      </div>

      <div class="row">
        <label for="filterHooks">Hide hook-bait posts</label>
        <label class="switch">
          <input type="checkbox" id="filterHooks">
          <span class="slider-toggle"></span>
        </label>
      </div>
      <div class="sub">
        <div class="sensitivity">
          <span class="hint">Sensitivity</span>
          <input type="range" id="hookSensitivity" min="0" max="2" step="1">
          <span class="level-label" id="sensitivityLabel">Medium</span>
        </div>
      </div>

      <div class="row">
        <label for="filterHustle">Mute fake hustle stories</label>
        <label class="switch">
          <input type="checkbox" id="filterHustle">
          <span class="slider-toggle"></span>
        </label>
      </div>

      <div class="row">
        <label for="filterAI">Hide AI-generated posts</label>
        <label class="switch">
          <input type="checkbox" id="filterAI">
          <span class="slider-toggle"></span>
        </label>
      </div>
      <div class="sub">
        <div class="sensitivity">
          <span class="hint">Sensitivity</span>
          <input type="range" id="aiSensitivity" min="0" max="2" step="1">
          <span class="level-label" id="aiSensitivityLabel">Medium</span>
        </div>
      </div>

      <div class="row">
        <label for="ghostMode">Ghost mode (dim instead of hide)</label>
        <label class="switch">
          <input type="checkbox" id="ghostMode">
          <span class="slider-toggle"></span>
        </label>
      </div>

    </div>
  </main>
  <footer>
    <span class="hint hint--flush">Phrases, authors &amp; stats live in settings</span>
    <a id="openOptions">Settings ⚙</a>
  </footer>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
